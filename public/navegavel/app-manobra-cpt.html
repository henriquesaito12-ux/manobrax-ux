<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Manobra X — App Manobra</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #EFEEE6;
    font-family: Arial, Helvetica, sans-serif;
    color: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .frame {
    width: 843px;
    height: 502px;
    background: #FFFFFF;
    border: 1px solid #D9D9D9;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    display: flex;
    overflow: hidden;
  }
  /* ---- Sidebar ---- */
  .sidebar {
    width: 250px;
    flex-shrink: 0;
    border-right: 1px solid #E3E3E3;
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  .app-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 14px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #1A1A1A; display: inline-block; }
  .sub-meta { font-size: 9px; color: #9A9A9A; margin-bottom: 18px; }
  .timer { font-size: 30px; font-weight: 700; line-height: 1; margin-bottom: 2px; }
  .timer-label { font-size: 8.5px; color: #9A9A9A; margin-bottom: 14px; }
  .steps {
    border: 1px solid #E3E3E3;
    border-radius: 6px;
    flex: 1;
    overflow: hidden;
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
  }
  .step {
    display: flex;
    gap: 8px;
    padding: 9px 10px;
    border-bottom: 1px solid #F2F2F2;
  }
  .step.active {
    border: 1px solid #1A1A1A;
    border-radius: 6px;
    margin: 3px;
  }
  .step-bullet {
    width: 10px; height: 10px; border-radius: 50%;
    border: 1.5px solid #9A9A9A;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .step.active .step-bullet { background: #1A1A1A; border-color: #1A1A1A; }
  .step-title { font-size: 9.5px; font-weight: 700; color: #1A1A1A; }
  .step.inactive .step-title { font-weight: 400; color: #9A9A9A; }
  .step-desc { font-size: 9px; color: #1A1A1A; margin-top: 1px; }
  .step-meta { font-size: 8px; color: #9A9A9A; margin-top: 2px; }
  .btn {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    font-size: 9.5px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
    cursor: default;
  }
  .btn-primary { background: #161616; color: #FFFFFF; border: none; }
  .btn-secondary { background: #FFFFFF; color: #1A1A1A; border: 1px solid #D9D9D9; }

  /* ---- Main panel ---- */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 16px 20px;
  }
  .top-row { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; }
  .badge-circle {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid #1A1A1A;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .badge-circle .num { font-size: 13px; font-weight: 700; line-height: 1; }
  .badge-circle .lbl { font-size: 6px; color: #9A9A9A; }
  .top-title { font-size: 15px; font-weight: 700; letter-spacing: 0.3px; }
  .track-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .bottom-labels {
    display: flex;
    justify-content: space-between;
    padding: 0 10px;
    font-size: 8.5px;
    color: #9A9A9A;
    font-weight: 700;
  }
  .lbl-box {
    border: 1px solid #9A9A9A;
    border-radius: 4px;
    padding: 2px 10px;
    color: #1A1A1A;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="sidebar">
      <div class="app-title">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#1A1A1A" stroke-width="2"/><circle cx="8" cy="16" r="1.5" fill="#1A1A1A"/><circle cx="16" cy="16" r="1.5" fill="#1A1A1A"/></svg>
        <span>Manobra X</span>
      </div>
      <div class="status-row"><span class="dot"></span><span>Em execução</span></div>
      <div class="sub-meta">Trem J105 · Bloco A · Etapa 3 de 6</div>
      <div class="timer">02:14</div>
      <div class="timer-label">tempo nesta etapa</div>

      <div class="steps">
        <div class="step active">
          <div class="step-bullet"></div>
          <div>
            <div class="step-title">3 · RETIRADA</div>
            <div class="step-desc">Avançar até o travessão T3</div>
            <div class="step-meta">40 m restantes</div>
          </div>
        </div>
        <div class="step inactive">
          <div class="step-bullet"></div>
          <div class="step-title">4 · Troca de maquinista</div>
        </div>
        <div class="step inactive">
          <div class="step-bullet"></div>
          <div class="step-title">5 · Inclusão</div>
        </div>
      </div>

      <button class="btn btn-primary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M5 3v18" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5" fill="none" stroke="#FFF" stroke-width="2" stroke-linejoin="round"/></svg>
        Concluir etapa
      </button>
      <button class="btn btn-secondary">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v11H8l-4 4V4z" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/></svg>
        Registrar observação
      </button>
    </div>

    <div class="main">
      <div class="top-row">
        <div class="badge-circle">
          <div class="num">40m</div>
          <div class="lbl">restantes</div>
        </div>
        <div class="top-title">AVANCE ATÉ O TRAVESSÃO T3</div>
      </div>

      <div class="track-area">
        <svg width="560" height="360" viewBox="0 0 560 360">
          <!-- center lane highlight (current track, L3) — bounded by the same two rails, same vanishing point -->
          <polygon points="280,40 390,330 170,330" fill="#EDEDED"/>

          <!-- ties (perspective sleepers), tapering toward the vanishing point -->
          <line x1="113" y1="260" x2="447" y2="260" stroke="#D9D9D9" stroke-width="1"/>
          <line x1="166" y1="190" x2="394" y2="190" stroke="#D9D9D9" stroke-width="1"/>
          <line x1="219" y1="120" x2="341" y2="120" stroke="#D9D9D9" stroke-width="1"/>

          <!-- diverging rail lines, all fanning from a single vanishing point -->
          <line x1="280" y1="40" x2="60" y2="330" stroke="#1A1A1A" stroke-width="1.3"/>
          <line x1="280" y1="40" x2="170" y2="330" stroke="#1A1A1A" stroke-width="1.3"/>
          <line x1="280" y1="40" x2="390" y2="330" stroke="#1A1A1A" stroke-width="1.3"/>
          <line x1="280" y1="40" x2="500" y2="330" stroke="#1A1A1A" stroke-width="1.3"/>

          <!-- GPS-style route line: guides the train from its position to the target pin -->
          <path d="M 280 55 C 302 130, 260 210, 280 288" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>

          <!-- direction chevrons along the route -->
          <polyline points="264,250 282,233 300,250" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="261,199 281,180 301,199" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="265,148 281,132 297,148" fill="none" stroke="#9A9A9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- pin: destination marker (travessão T3), sits at the vanishing point -->
          <g transform="translate(280,32)">
            <circle cx="0" cy="0" r="7" fill="#1A1A1A"/>
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
          </g>

          <!-- train marker, pointing up the route toward the pin -->
          <polygon points="280,283 255,330 305,330" fill="#1A1A1A"/>
        </svg>
      </div>

      <div class="bottom-labels">
        <span>L4</span>
        <span class="lbl-box">L3</span>
        <span>L Desvio</span>
      </div>
    </div>
  </div>
</body>
</html>
