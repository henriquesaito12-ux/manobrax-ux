<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Manobra X — App Maquinista (V3, sem mapa)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #EFEEE6;
    font-family: Arial, Helvetica, sans-serif;
    color: #1A1A1A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .frame {
    width: 960px;
    height: 660px;
    background: #FFFFFF;
    border: 1px solid #D9D9D9;
    border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  .header {
    display: flex;
    align-items: center;
    gap: 28px;
    padding: 24px 36px;
    border-bottom: 1px solid #E3E3E3;
    flex-shrink: 0;
  }
  .app-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 21px;
    font-weight: 700;
  }
  .header-divider { width: 1px; align-self: stretch; background: #E3E3E3; }
  .status-row {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #1A1A1A; display: inline-block; flex-shrink: 0; }
  .sub-meta { font-size: 12.5px; color: #9A9A9A; }

  /* ---- Content ---- */
  .content { flex: 1; display: flex; min-height: 0; }

  .left-col {
    width: 400px;
    flex-shrink: 0;
    border-right: 1px solid #E3E3E3;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
  }

  .timer-block { text-align: center; margin-bottom: 26px; }
  .timer { font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: 0.5px; }
  .timer-label { font-size: 11.5px; color: #9A9A9A; margin-top: 6px; text-transform: uppercase; letter-spacing: 0.5px; }

  .current-card {
    border: 2px solid #1A1A1A;
    border-radius: 10px;
    padding: 22px 24px;
    margin-bottom: auto;
  }
  .current-card-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }
  .current-num-badge {
    width: 30px; height: 30px; border-radius: 50%;
    background: #1A1A1A; color: #FFFFFF;
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .current-name { font-size: 18px; font-weight: 700; letter-spacing: 0.3px; }
  .current-instruction { font-size: 15px; color: #1A1A1A; margin-bottom: 12px; line-height: 1.4; }
  .current-meta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #1A1A1A;
    border: 1px solid #9A9A9A;
    border-radius: 5px;
    padding: 5px 11px;
  }

  .actions { margin-top: 26px; }
  .btn {
    width: 100%;
    padding: 15px;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    margin-bottom: 10px;
    cursor: default;
  }
  .btn:last-child { margin-bottom: 0; }
  .btn-primary { background: #161616; color: #FFFFFF; border: none; }
  .btn-secondary { background: #FFFFFF; color: #1A1A1A; border: 1px solid #D9D9D9; }

  .right-col {
    flex: 1;
    padding: 32px 36px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .section-label {
    font-size: 11.5px;
    font-weight: 700;
    color: #9A9A9A;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  .steps {
    border: 1px solid #E3E3E3;
    border-radius: 8px;
    overflow: hidden;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    border-bottom: 1px solid #F2F2F2;
    flex: 1;
  }
  .step:last-child { border-bottom: none; }
  .step.active {
    border: 2px solid #1A1A1A;
    border-radius: 7px;
    margin: 5px;
  }
  .step-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .step-icon.done { background: #1A1A1A; }
  .step-icon.pending { border: 1.5px solid #C7C7C7; }
  .step-icon.active { border: 1.5px solid #1A1A1A; background: #1A1A1A; }
  .step-title { font-size: 15px; font-weight: 700; color: #1A1A1A; }
  .step.done .step-title { color: #9A9A9A; }
  .step.pending .step-title { font-weight: 400; color: #9A9A9A; }
</style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <div class="app-title">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="3" stroke="#1A1A1A" stroke-width="2"/><circle cx="8" cy="16" r="1.5" fill="#1A1A1A"/><circle cx="16" cy="16" r="1.5" fill="#1A1A1A"/></svg>
        <span>Manobra X</span>
      </div>
      <div class="header-divider"></div>
      <div>
        <div class="status-row"><span class="dot"></span><span>Em execução</span></div>
        <div class="sub-meta">Trem J105 · Bloco A · Etapa 3 de 6</div>
      </div>
    </div>

    <div class="content">
      <div class="left-col">
        <div class="timer-block">
          <div class="timer">02:14</div>
          <div class="timer-label">tempo nesta etapa</div>
        </div>

        <div class="current-card">
          <div class="current-card-head">
            <div class="current-num-badge">3</div>
            <div class="current-name">RETIRADA</div>
          </div>
          <div class="current-instruction">Avançar até o travessão T3</div>
          <div class="current-meta">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M12 2v20M5 9l7-7 7 7" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            40 m restantes
          </div>
        </div>

        <div class="actions">
          <button class="btn btn-primary">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M5 3v18" stroke="#FFF" stroke-width="2" stroke-linecap="round"/><path d="M5 4h13l-3 4 3 4H5" fill="none" stroke="#FFF" stroke-width="2" stroke-linejoin="round"/></svg>
            Concluir etapa
          </button>
          <button class="btn btn-secondary">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 4h16v11H8l-4 4V4z" stroke="#1A1A1A" stroke-width="2" stroke-linejoin="round"/></svg>
            Registrar observação
          </button>
        </div>
      </div>

      <div class="right-col">
        <div class="section-label">Etapas da manobra</div>
        <div class="steps">
          <div class="step done">
            <div class="step-icon done">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="step-title">1 · Parada</div>
          </div>
          <div class="step done">
            <div class="step-icon done">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M4 12l6 6L20 6" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="step-title">2 · Corte</div>
          </div>
          <div class="step active">
            <div class="step-icon active"></div>
            <div class="step-title">3 · Retirada</div>
          </div>
          <div class="step pending">
            <div class="step-icon pending"></div>
            <div class="step-title">4 · Troca de maquinista</div>
          </div>
          <div class="step pending">
            <div class="step-icon pending"></div>
            <div class="step-title">5 · Inclusão</div>
          </div>
          <div class="step pending">
            <div class="step-icon pending"></div>
            <div class="step-title">6 · Liberação da via</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
